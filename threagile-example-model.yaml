title: 445Cyber Co. Risk Model

date: 2025-12-11

author:
  name: Student
  homepage: 

management_summary_comment: >
  445Cyber Co. is a rapidly growing cybersecurity consulting company that failed a Red Team inspection
  and must rebuild its systems from scratch with exemplary security and resilience to maintain a major
  contract serving hundreds of organizations.

business_criticality: critical

business_overview:
  description: >
    445Cyber Co. provides cybersecurity consulting services to clients, with 48 consultants and technicians
    performing onsite assessments, network analysis, and security implementation. The company must demonstrate
    exemplary cybersecurity practices for its own systems as a contract requirement.

technical_overview:
  description: >
    Current systems include Windows laptops (individually configured), Windows-based file/email servers,
    an insecure MS-Access database with shared credentials, and outsourced accounting. The proposed solution
    will migrate to cloud-based services with proper security controls, encryption, access management, and
    resilience measures including automated backups and disaster recovery capabilities.

questions:
  How are client files kept separate and secure?: >
    Client files will be segregated using folder structures with role-based access control in cloud storage,
    with encryption at rest and in transit.
  How will laptops be provisioned securely?: >
    Standardized secure laptop provisioning with full disk encryption, EDR agents, automated patching,
    and configuration management.
  How will remote access be secured?: >
    VPN with multi-factor authentication for all remote access to internal resources.

abuse_cases:
  Client Data Theft: >
    As a hacker I want to steal client deliverables and analysis documents in order to sell them to
    competitors or leak them publicly to damage 445Cyber's reputation.
  Ransomware Attack: >
    As a hacker I want to encrypt 445Cyber's file servers and databases in order to extort ransom
    and disrupt business operations.
  Credential Compromise: >
    As a hacker I want to steal employee credentials in order to gain unauthorized access to client
    data and internal systems.
  Laptop Theft Data Breach: >
    As a hacker I want to steal unencrypted laptops from consultants in the field in order to
    access sensitive client information.
  Database Compromise: >
    As a hacker I want to exploit the weak database credentials to access billing, payment, and
    client interaction records.

security_requirements:
  Multi-Factor Authentication: All administrative and remote access must use MFA.
  Data Encryption: All sensitive data must be encrypted at rest and in transit.
  Access Control: Role-based access control must be implemented for all systems.
  Secure Development: Developers must follow secure coding guidelines for all custom applications.
  Backup and Recovery: Critical systems must have automated backups with tested recovery procedures.
  Incident Response: Documented incident response procedures must be in place.

