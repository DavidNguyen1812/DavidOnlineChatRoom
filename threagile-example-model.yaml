individual_risk_categories:

  Weak Database Credentials:
    id: weak-db-credentials
    description: Legacy MS-Access database uses shared credentials (dbuser/Passw0rd)
    impact: Unauthorized access to client billing and interaction records
    asvs: V2 - Authentication
    cheat_sheet: https://cheatsheetseries.owasp.org/cheatsheets/Authentication_Cheat_Sheet.html
    action: Replace MS-Access with secure cloud database with proper authentication
    mitigation: Implement role-based access control with individual credentials and MFA
    check: Verify no shared credentials exist in production systems
    function: architecture
    stride: elevation-of-privilege
    detection_logic: Monitor for database access attempts with default credentials
    risk_assessment: Critical risk due to shared credentials and lack of access control
    false_positives: Legitimate admin access may trigger alerts
    model_failure_possible_reason: false
    cwe: 798
    risks_identified:
      <b>Shared Database Credentials</b> at <b>Application Database</b>:
        severity: critical
        exploitation_likelihood: very-likely
        exploitation_impact: very-high
        data_breach_probability: probable
        data_breach_technical_assets:
          - application-database
        most_relevant_data_asset: client-billing-data
        most_relevant_technical_asset: application-database
        most_relevant_communication_link:
        most_relevant_trust_boundary:
        most_relevant_shared_runtime:

  Unencrypted Laptop Data:
    id: unencrypted-laptops
    description: Consultant laptops lack full disk encryption
    impact: Laptop theft could expose client deliverables and sensitive data
    asvs: V8 - Data Protection
    cheat_sheet: https://cheatsheetseries.owasp.org/cheatsheets/Cryptographic_Storage_Cheat_Sheet.html
    action: Implement full disk encryption (BitLocker) on all laptops
    mitigation: Require full disk encryption and remote wipe capabilities
    check: Verify all laptops have encryption enabled via MDM
    function: operations
    stride: information-disclosure
    detection_logic: MDM reporting on encryption status
    risk_assessment: High risk due to field work and potential laptop theft
    false_positives: None
    model_failure_possible_reason: false
    cwe: 311
    risks_identified:
      <b>Unencrypted Laptops</b> at <b>Consultant Laptops</b>:
        severity: high
        exploitation_likelihood: likely
        exploitation_impact: high
        data_breach_probability: probable
        data_breach_technical_assets:
          - consultant-laptops
        most_relevant_data_asset: client-deliverables
        most_relevant_technical_asset: consultant-laptops
        most_relevant_communication_link:
        most_relevant_trust_boundary:
        most_relevant_shared_runtime:

